<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eladis Boutique - Productos</title>
    <link rel="icon" type="image/png" href="img/logo_eladis_boutique.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .products-container {
            min-height: 100vh;
            background: var(--background);
        }

        .products-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            gap: 12px;
            flex-wrap: wrap;
        }

        .products-header .dashboard-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .products-header .dashboard-logo svg {
            width: 40px;
            height: 40px;
            color: var(--primary);
        }

        .products-header .dashboard-logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-create-product {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-create-product:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-create-product svg {
            width: 18px;
            height: 18px;
        }

        .btn-categories {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--secondary);
            border-radius: var(--radius-md);
            color: var(--secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-categories:hover {
            background: rgba(237, 137, 54, 0.1);
        }

        .btn-categories svg {
            width: 18px;
            height: 18px;
        }

        .btn-logout {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-logout:hover {
            background: var(--background);
            color: var(--primary);
            border-color: var(--primary);
        }

        .products-main {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .products-section-header {
            margin-bottom: 24px;
        }

        .products-section-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .products-section-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .products-table-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .products-table thead th {
            background: var(--background);
            padding: 16px 24px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .products-table tbody td {
            padding: 16px 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .products-table tbody td.price-cell {
            text-align: center;
        }

        .products-table tbody tr:last-child td {
            border-bottom: none;
        }

        .products-table tbody tr:hover {
            background: var(--background);
        }

        .products-empty {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }

        .products-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .products-empty p {
            font-size: 15px;
        }

        .product-count {
            display: inline-block;
            background: var(--background);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 8px;
        }

        .category-count {
            display: inline-block;
            background: var(--background);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 8px;
        }

        .loading-container {
            text-align: center;
            padding: 60px 24px;
        }

        .spinner-lg {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal .modal-body-scroll {
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .modal .modal-body-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .modal .modal-body-scroll::-webkit-scrollbar-track {
            background: var(--background);
            border-radius: 3px;
        }

        .modal .modal-body-scroll::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .category-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }

        .category-row:last-child {
            border-bottom: none;
        }

        .category-name {
            font-size: 14px;
            color: var(--text-primary);
        }

        .btn-add-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-add-row:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(45, 55, 72, 0.03);
        }

        .btn-add-row svg {
            width: 18px;
            height: 18px;
        }

        .btn-create {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-create:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-create:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .product-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            align-items: end;
            padding: 12px;
            background: var(--background);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            position: relative;
        }

        .product-row.multiple {
            padding-right: 44px;
        }

        .product-row .form-group input {
            padding: 14px 16px;
            font-size: 15px;
            border-color: var(--border);
        }

        .product-row .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 55, 72, 0.15);
        }

        .product-row .form-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--card-bg);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .product-row .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 55, 72, 0.15);
        }

        .product-row .remove-row {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            background: var(--error-bg);
            color: var(--error);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            transition: var(--transition);
            line-height: 1;
        }

        .product-row .remove-row:hover {
            background: var(--error);
            color: white;
        }

        .product-row .remove-row.hide {
            display: none;
        }

        .modal-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 24px 24px;
        }

        .modal-footer .btn-create {
            width: 100%;
            margin-top: 0;
        }

        #createCategoryForm .btn-create {
            margin-top: 16px;
            width: 100%;
        }

        .modal .form-error {
            font-size: 13px;
            color: var(--error);
            margin-top: 4px;
            display: none;
        }

        #createProductModal .modal-content {
            max-width: 900px;
        }

        #createCategoryModal .modal-content {
            max-width: 450px;
        }

        @media (max-width: 900px) {
            .product-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .products-header {
                padding: 16px 20px;
            }

            .products-main {
                padding: 20px;
            }

            .products-table thead th,
            .products-table tbody td {
                padding: 12px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 600px) {
            .product-row {
                grid-template-columns: 1fr;
            }

            .products-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="products-container">
        <header class="products-header">
            <!-- Workspace Menu Button (far left) -->
            <button type="button" class="workspace-menu-btn" id="workspaceMenuBtn" aria-label="Abrir menú de espacios de trabajo" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </button>
            <div class="dashboard-logo">
                <img src="img/logo_eladis_boutique.png" alt="Eladis Boutique" style="width: 40px; height: 40px; object-fit: contain;">
                <h1>Eladis Boutique</h1>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="btn-create-product" id="btnCrearProducto">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Crear producto
                </button>
                <button class="btn-categories" id="btnCategorias">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                        <line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                    Categorías
                </button>
                <button class="btn-logout" id="btnBack">← Regresar</button>
            </div>
        </header>

        <!-- Workspace Drawer -->
        <div class="workspace-drawer" id="workspaceDrawer" role="navigation" aria-label="Espacios de trabajo">
            <div class="workspace-drawer-header">
                <img src="img/logo_eladis_boutique.png" alt="Eladis Boutique" style="width: 71px; height: 71px; object-fit: contain;">
                <h3>Eladis Boutique</h3>
                <button type="button" class="workspace-drawer-close" id="workspaceDrawerClose" aria-label="Cerrar menú">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="workspace-drawer-content">
                <div class="workspace-drawer-section">
                    <div class="workspace-drawer-section-title">Navegación</div>
                    <a href="dashboard.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        Dashboard
                    </a>
                    <a href="productos.html" class="workspace-drawer-item active-workspace" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                            <line x1="7" y1="7" x2="7.01" y2="7"/>
                        </svg>
                        Productos
                    </a>
                    <a href="inventario.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                            <line x1="7" y1="7" x2="7.01" y2="7"/>
                        </svg>
                        Inventario
                    </a>
                    <a href="ventas.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"/>
                            <circle cx="20" cy="21" r="1"/>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 1-2 1.61H9.72a2 2 0 0 1-2-1.61L23 6H6"/>
                        </svg>
                        Ventas
                    </a>
                    <a href="compras.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <path d="M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                        Compras
                    </a>
                    <a href="financiera.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"/>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                        Gestión Financiera
                    </a>
                    <a href="usuarios.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Usuarios
                    </a>
                    <a href="historial.html" class="workspace-drawer-item" role="menuitem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 8v4l2 2"/>
                        </svg>
                        Historial
                    </a>
                </div>
            </div>
            <div class="workspace-drawer-footer">
                <div class="workspace-drawer-user">
                    <div class="workspace-drawer-user-avatar" id="workspaceUserAvatar">EB</div>
                    <div class="workspace-drawer-user-info">
                        <div class="workspace-drawer-user-name" id="workspaceUserName">Usuario</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="workspace-drawer-overlay" id="workspaceDrawerOverlay"></div>

        <main class="products-main">
            <section class="products-section-header">
                <h2>
                    Productos
                    <span class="product-count" id="productCount">0</span>
                </h2>
                <p>Administra el catálogo de productos de la tienda.</p>
            </section>

            <div class="products-table-wrapper">
                <div id="tableContent">
                    <div class="loading-container">
                        <div class="spinner-lg"></div>
                        <p style="color: var(--text-muted);">Cargando productos...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="createProductModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="createProductTitle">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="createProductTitle">Crear nuevo producto</h2>
                <button type="button" class="modal-close" id="closeCreateModal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-body-scroll">
                    <div id="productRows"></div>
                    <button type="button" class="btn-add-row" id="btnAddRow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Agregar producto
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-create" id="btnCrear">
                    <span id="btnCrearText">Crear productos</span>
                    <span id="btnCrearLoader" style="display:none;">
                        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
                        </svg>
                    </span>
                </button>
                <button type="button" class="btn-modal-primary" id="cancelCreateBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="createCategoryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="createCategoryTitle">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="createCategoryTitle">Categorías</h2>
                <button type="button" class="modal-close" id="closeCategoryModal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-body-scroll" id="categoryList">
                </div>
                <button type="button" class="btn-add-row" id="btnAddCategory" style="margin-top:12px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Crear categoría
                </button>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-primary" id="cancelCategoryBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="createSingleCategoryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="createSingleCategoryTitle">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="createSingleCategoryTitle">Crear categoría</h2>
                <button type="button" class="modal-close" id="closeSingleCategoryModal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="createCategoryForm" novalidate>
                    <div class="form-group">
                        <label for="newCategoryName">Nombre</label>
                        <input type="text" id="newCategoryName" name="name" placeholder="Ropa de verano" required>
                        <div class="form-error" id="categoryNameError"></div>
                    </div>
                    <button type="submit" class="btn-create" id="btnSaveCategory">
                        <span id="btnSaveCategoryText">Guardar</span>
                        <span id="btnSaveCategoryLoader" style="display:none;">
                            <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                </form>
</div>
    </div>
</div>

    <!-- Modal Editar Producto -->
    <div id="editProductModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editProductTitle">
        <div class="modal-overlay"></div>
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h2 id="editProductTitle">Editar producto</h2>
                <button type="button" class="modal-close" id="closeEditModal" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="editProductForm" novalidate>
                    <div class="form-group">
                        <label for="editReference">Referencia</label>
                        <input type="text" id="editReference" name="reference" required disabled style="background: var(--background);">
                    </div>
                    <div class="form-group">
                        <label for="editCategory">Categoría</label>
                        <select id="editCategory" name="category" required>
                            <option value="">Seleccionar...</option>
                        </select>
                        <div class="form-error" id="editRoleError"></div>
                    </div>
                    <div class="form-group">
                        <label for="editSize">Tallas (ej. S, M, L)</label>
                        <input type="text" id="editSize" name="size" placeholder="S, M, L" required>
                        <div class="form-error" id="editNameError"></div>
                    </div>
                    <div class="form-group">
                        <label for="editSalePrice">Precio de venta</label>
                        <input type="text" id="editSalePrice" name="sale_price" placeholder="0" required inputmode="decimal" class="price-input">
                        <div class="form-error" id="editEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="editPurchasePrice">Precio de compra</label>
                        <input type="text" id="editPurchasePrice" name="purchase_price" placeholder="0" required inputmode="decimal" class="price-input">
                        <div class="form-error" id="editPasswordError"></div>
                    </div>
                    <button type="submit" class="btn-create" id="btnSaveEdit" style="width: 100%; margin-top: 8px;">
                        <span id="btnSaveEditText">Guardar cambios</span>
                        <span id="btnSaveEditLoader" style="display:none;">
                            <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal-primary" id="cancelEditBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase, guardPage } from './app.js';

        const btnCrearProducto = document.getElementById('btnCrearProducto');
        const btnCategorias = document.getElementById('btnCategorias');
        const btnBack = document.getElementById('btnBack');

        const createProductModal = document.getElementById('createProductModal');
        const closeCreateModal = document.getElementById('closeCreateModal');
        const cancelCreateBtn = document.getElementById('cancelCreateBtn');
        const btnCrear = document.getElementById('btnCrear');
        const btnCrearText = document.getElementById('btnCrearText');
        const btnCrearLoader = document.getElementById('btnCrearLoader');
        const productRows = document.getElementById('productRows');
        const btnAddRow = document.getElementById('btnAddRow');
        const tableContent = document.getElementById('tableContent');
        const productCount = document.getElementById('productCount');

        const createCategoryModal = document.getElementById('createCategoryModal');
        const closeCategoryModal = document.getElementById('closeCategoryModal');
        const cancelCategoryBtn = document.getElementById('cancelCategoryBtn');
        const btnAddCategory = document.getElementById('btnAddCategory');
        const categoryList = document.getElementById('categoryList');

        const createSingleCategoryModal = document.getElementById('createSingleCategoryModal');
        const closeSingleCategoryModal = document.getElementById('closeSingleCategoryModal');
        const createCategoryForm = document.getElementById('createCategoryForm');
        const newCategoryName = document.getElementById('newCategoryName');
        const categoryNameError = document.getElementById('categoryNameError');
        const btnSaveCategory = document.getElementById('btnSaveCategory');
        const btnSaveCategoryText = document.getElementById('btnSaveCategoryText');
        const btnSaveCategoryLoader = document.getElementById('btnSaveCategoryLoader');

        // Edit Product Modal Elements
        const editProductModal = document.getElementById('editProductModal');
        const closeEditModal = document.getElementById('closeEditModal');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editProductForm = document.getElementById('editProductForm');
        const editRefInput = document.getElementById('editReference');
        const editCatSelect = document.getElementById('editCategory');
        const editSizeInput = document.getElementById('editSize');
        const editSalePriceInput = document.getElementById('editSalePrice');
        const editPurchasePriceInput = document.getElementById('editPurchasePrice');
        const btnSaveEdit = document.getElementById('btnSaveEdit');
        const btnSaveEditText = document.getElementById('btnSaveEditText');
        const btnSaveEditLoader = document.getElementById('btnSaveEditLoader');
        const editNameError = document.getElementById('editNameError');
        const editEmailError = document.getElementById('editEmailError');
        const editPasswordError = document.getElementById('editPasswordError');
        const editRoleError = document.getElementById('editRoleError');

        let rowCount = 0;
        let categories = [];

        function buildCategoryOptionsHTML() {
            let catOptions = '<option value="">Seleccionar...</option>';
            categories.forEach(cat => {
                catOptions += `<option value="${escapeHtml(cat.name)}">${escapeHtml(cat.name)}</option>`;
            });
            return catOptions;
        }

        function createRowHTML(index) {
            const catOptions = buildCategoryOptionsHTML();
            return `
                <div class="product-row" data-index="${index}">
                    <div class="form-group">
                        <input type="text" name="reference_${index}" placeholder="Referencia" required>
                    </div>
                    <div class="form-group">
                        <select name="category_${index}" required>
                            ${catOptions}
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" name="size_${index}" placeholder="Tallas (ej. S, M, L)" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="sale_price_${index}" placeholder="P. Venta" required inputmode="decimal" class="price-input">
                    </div>
                    <div class="form-group">
                        <input type="text" name="purchase_price_${index}" placeholder="P. Compra" required inputmode="decimal" class="price-input">
                    </div>
                    <button type="button" class="remove-row" data-index="${index}" aria-label="Eliminar fila">×</button>
                </div>
            `;
        }

        async function loadCategories() {
            const { data, error } = await supabase
                .from('categories')
                .select('name')
                .order('name', { ascending: true });

            if (error) {
                console.error('Error loading categories:', error);
                return;
            }

            categories = data || [];
        }

        async function loadCategoriesIntoModal() {
            await loadCategories();
            renderCategoryList();
        }

        function renderCategoryList() {
            if (!categories.length) {
                categoryList.innerHTML = '<div class="products-empty"><p>No hay categorías.</p></div>';
                return;
            }

            let html = '';
            categories.forEach(cat => {
                html += `
                    <div class="category-row">
                        <span class="category-name">${escapeHtml(cat.name)}</span>
                    </div>
                `;
            });
            categoryList.innerHTML = html;
        }

         function openProductModal() {
            productRows.innerHTML = '';
            rowCount = 0;
            productRows.insertAdjacentHTML('beforeend', createRowHTML(rowCount++));
            attachPriceListeners();
            updateRemoveButtons();
            createProductModal.style.display = 'flex';
        }

         function updateRemoveButtons() {
            const rows = productRows.querySelectorAll('.product-row');
            const hasMultiple = rows.length > 1;
            rows.forEach(row => {
                const removeBtn = row.querySelector('.remove-row');
                if (removeBtn) {
                    if (hasMultiple) {
                        removeBtn.classList.remove('hide');
                        row.classList.add('multiple');
                    } else {
                        removeBtn.classList.add('hide');
                        row.classList.remove('multiple');
                    }
                }
            });
        }

         function closeProductModal() {
            createProductModal.style.display = 'none';
        }

        function openCategoryModal() {
            loadCategoriesIntoModal();
            createCategoryModal.style.display = 'flex';
        }

        function closeCategoryModalFn() {
            createCategoryModal.style.display = 'none';
        }

        function openSingleCategoryModal() {
            newCategoryName.value = '';
            categoryNameError.style.display = 'none';
            createSingleCategoryModal.style.display = 'flex';
        }

        function closeSingleCategoryModalFn() {
            createSingleCategoryModal.style.display = 'none';
        }

        function attachPriceListeners() {
            productRows.querySelectorAll('.price-input').forEach(input => {
                if (!input.dataset.priceListener) {
                    input.addEventListener('input', onPriceInput);
                    input.dataset.priceListener = 'true';
                }
            });
        }

        function onPriceInput(e) {
            const input = e.target;
            const cursor = input.selectionStart;
            formatPrice(input);
            const digitsBeforeCursor = input.value.substring(0, cursor).replace(/[^0-9]/g, '').length;
            let digitCount = 0;
            for (let i = 0; i < input.value.length; i++) {
                if (/[0-9]/.test(input.value[i])) {
                    digitCount++;
                    if (digitCount === digitsBeforeCursor) {
                        input.setSelectionRange(i + 1, i + 1);
                        break;
                    }
                }
            }
        }

        function formatPrice(input) {
            const raw = input.value.replace(/[^0-9]/g, '');
            if (raw === '') {
                input.value = '';
                return;
            }
            let formatted = '';
            let count = 0;
            for (let i = raw.length - 1; i >= 0; i--) {
                if (count > 0 && count % 3 === 0) {
                    formatted = '.' + formatted;
                }
                formatted = raw[i] + formatted;
                count++;
            }
            input.value = formatted;
        }

        function parsePrice(raw) {
            return parseFloat(raw.replace(/\./g, '')) || 0;
        }

        btnAddRow.addEventListener('click', () => {
            productRows.insertAdjacentHTML('beforeend', createRowHTML(rowCount++));
            attachPriceListeners();
            updateRemoveButtons();
            const lastRow = productRows.lastElementChild;
            if (lastRow) {
                lastRow.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
        });

        productRows.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-row')) {
                const row = e.target.closest('.product-row');
                if (productRows.children.length > 1) {
                    row.remove();
                    updateRemoveButtons();
                } else {
                    row.querySelectorAll('input, select').forEach(el => el.value = '');
                }
            }
        });

        btnAddCategory.addEventListener('click', () => {
            openSingleCategoryModal();
        });

        createCategoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = newCategoryName.value.trim();

            if (!name || name.length < 2) {
                categoryNameError.textContent = 'El nombre debe tener al menos 2 caracteres.';
                categoryNameError.style.display = 'block';
                return;
            }

            categoryNameError.style.display = 'none';
            btnSaveCategory.disabled = true;
            btnSaveCategoryText.style.display = 'none';
            btnSaveCategoryLoader.style.display = 'flex';

            try {
                const { error: insertError } = await supabase
                    .from('categories')
                    .insert({ name });

                if (insertError) {
                    throw insertError;
                }

                closeSingleCategoryModalFn();
                await loadCategoriesIntoModal();
            } catch (err) {
                console.error('Error creating category:', err);
                alert(err.message || 'Error al crear la categoría');
            } finally {
                btnSaveCategory.disabled = false;
                btnSaveCategoryText.style.display = 'inline';
                btnSaveCategoryLoader.style.display = 'none';
            }
        });

        async function loadProducts() {
            await loadCategories();

            tableContent.innerHTML = `
                <div class="loading-container">
                    <div class="spinner-lg"></div>
                    <p style="color: var(--text-muted);">Cargando productos...</p>
                </div>
            `;

            const { data, error } = await supabase
                .from('products')
                .select('reference, categorie, size, sale_price, purchase_price')
                .order('reference', { ascending: true });

            if (error) {
                tableContent.innerHTML = `<div class="products-empty"><p>Error al cargar los productos. Intenta de nuevo.</p></div>`;
                console.error('Error loading products:', error);
                return;
            }

            allProducts = data || [];
            productCount.textContent = data ? data.length : 0;

            if (!data || data.length === 0) {
                tableContent.innerHTML = `
                    <div class="products-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                            <line x1="7" y1="7" x2="7.01" y2="7"/>
                        </svg>
                        <p>No hay productos registrados aún.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Referencia</th>
                            <th>Categoría</th>
                            <th>Tallas</th>
                            <th>P. Venta</th>
                            <th>P. Compra</th>
                            <th class="actions-cell">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(product => {
                const formattedSizes = Array.isArray(product.size) 
                    ? product.size.join(', ') 
                    : (product.size || '—');
                html += `
                    <tr>
                        <td>${escapeHtml(product.reference)}</td>
                        <td>${escapeHtml(product.categorie)}</td>
                        <td>${escapeHtml(formattedSizes)}</td>
                        <td class="price-cell">${formatDisplayPrice(product.sale_price)}</td>
                        <td class="price-cell">${formatDisplayPrice(product.purchase_price)}</td>
                        <td class="actions-cell">
                            <button class="btn-action btn-edit" data-reference="${escapeHtml(product.reference)}" aria-label="Editar producto">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </button>
                            <button class="btn-action btn-delete" data-reference="${escapeHtml(product.reference)}" aria-label="Eliminar producto">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            tableContent.innerHTML = html;

            // Event listeners for action buttons
            tableContent.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => openEditProductModal(btn.dataset.reference));
            });
            tableContent.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteProduct(btn.dataset.reference));
            });
        }

        function formatDisplayPrice(value) {
            if (value === null || value === undefined || value === '') return '—';
            const num = typeof value === 'string' ? parseFloat(value.replace(/[^0-9.-]/g, '')) : Number(value);
            if (isNaN(num)) return '—';
            return num.toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        // Edit Product Modal Functions
        let allProducts = [];
        let currentEditingReference = null;

        function openEditProductModal(reference) {
            const product = allProducts.find(p => p.reference === reference);
            if (!product) return;

            currentEditingReference = reference;

            editRefInput.value = product.reference;
            editCatSelect.innerHTML = buildCategoryOptionsHTML();
            editCatSelect.value = product.categorie || '';
            editSizeInput.value = Array.isArray(product.size) ? product.size.join(', ') : (product.size || '');
            editSalePriceInput.value = formatDisplayPrice(product.sale_price);
            editPurchasePriceInput.value = formatDisplayPrice(product.purchase_price);

            editNameError.style.display = 'none';
            editEmailError.style.display = 'none';
            editPasswordError.style.display = 'none';
            editRoleError.style.display = 'none';

            editProductModal.style.display = 'flex';
        }

        function closeEditProductModal() {
            editProductModal.style.display = 'none';
            currentEditingReference = null;
            editProductForm.reset();
        }

        async function deleteProduct(reference) {
            if (!confirm(`¿Eliminar el producto "${reference}"?`)) return;

            try {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('reference', reference);

                if (error) throw error;

                await loadProducts();
            } catch (err) {
                console.error('Error deleting product:', err);
                alert(err.message || 'Error al eliminar el producto');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        btnCrearProducto.addEventListener('click', openProductModal);
        btnCategorias.addEventListener('click', openCategoryModal);
        btnBack.addEventListener('click', () => { window.location.href = 'dashboard.html'; });

        // Workspace Drawer
        const workspaceMenuBtn = document.getElementById('workspaceMenuBtn');
        const workspaceDrawer = document.getElementById('workspaceDrawer');
        const workspaceDrawerOverlay = document.getElementById('workspaceDrawerOverlay');
        const workspaceDrawerClose = document.getElementById('workspaceDrawerClose');

        function openWorkspaceDrawer() {
            workspaceDrawer.classList.add('active');
            workspaceDrawerOverlay.classList.add('active');
            workspaceMenuBtn.setAttribute('aria-expanded', 'true');
        }

        function closeWorkspaceDrawer() {
            workspaceDrawer.classList.remove('active');
            workspaceDrawerOverlay.classList.remove('active');
            workspaceMenuBtn.setAttribute('aria-expanded', 'false');
        }

        workspaceMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (workspaceDrawer.classList.contains('active')) {
                closeWorkspaceDrawer();
            } else {
                openWorkspaceDrawer();
            }
        });

        workspaceDrawerClose.addEventListener('click', closeWorkspaceDrawer);
        workspaceDrawerOverlay.addEventListener('click', closeWorkspaceDrawer);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && workspaceDrawer.classList.contains('active')) {
                closeWorkspaceDrawer();
                workspaceMenuBtn.focus();
            }
        });

        // Load user profile and apply role-based restrictions
        async function loadWorkspaceUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session?.user) return;

            const { data: profile, error } = await supabase
                .from('users')
                .select('name, role')
                .eq('user_id', session.user.id)
                .maybeSingle();

            const name = profile?.name || session.user.user_metadata?.name || 'Usuario';
            const role = profile?.role || null;

            const avatar = document.getElementById('workspaceUserAvatar');
            const nameEl = document.getElementById('workspaceUserName');
            if (avatar) avatar.textContent = name.charAt(0).toUpperCase();
            if (nameEl) nameEl.textContent = name;

            // Apply role-based restrictions (hide for 'usuario' role)
            const isUserRole = String(role || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') === 'usuario';
            const restrictedModules = ['usuarios', 'productos', 'compras'];
            if (isUserRole) {
                restrictedModules.forEach(module => {
                    const item = document.querySelector(`.workspace-drawer-item[href="${module}.html"]`);
                    if (item) item.style.display = 'none';
                });
            }
        }
        loadWorkspaceUser();

        closeCreateModal.addEventListener('click', closeProductModal);
        cancelCreateBtn.addEventListener('click', closeProductModal);
        closeCategoryModal.addEventListener('click', closeCategoryModalFn);
        cancelCategoryBtn.addEventListener('click', closeCategoryModalFn);
        closeSingleCategoryModal.addEventListener('click', closeSingleCategoryModalFn);

        createProductModal.addEventListener('click', (e) => {
            if (e.target === createProductModal || e.target.classList.contains('modal-overlay')) {
                closeProductModal();
            }
        });

        createCategoryModal.addEventListener('click', (e) => {
            if (e.target === createCategoryModal || e.target.classList.contains('modal-overlay')) {
                closeCategoryModalFn();
            }
        });

        createSingleCategoryModal.addEventListener('click', (e) => {
            if (e.target === createSingleCategoryModal || e.target.classList.contains('modal-overlay')) {
                closeSingleCategoryModalFn();
            }
        });

        // Edit Product Modal Event Listeners
        closeEditModal.addEventListener('click', closeEditProductModal);
        cancelEditBtn.addEventListener('click', closeEditProductModal);
        editProductModal.addEventListener('click', (e) => {
            if (e.target === editProductModal || e.target.classList.contains('modal-overlay')) {
                closeEditProductModal();
            }
        });

        // Price formatting for edit modal
        [editSalePriceInput, editPurchasePriceInput].forEach(input => {
            input.addEventListener('input', (e) => {
                const cursor = input.selectionStart;
                formatPrice(input);
                const digitsBeforeCursor = input.value.substring(0, cursor).replace(/[^0-9]/g, '').length;
                let digitCount = 0;
                for (let i = 0; i < input.value.length; i++) {
                    if (/[0-9]/.test(input.value[i])) {
                        digitCount++;
                        if (digitCount === digitsBeforeCursor) {
                            input.setSelectionRange(i + 1, i + 1);
                            break;
                        }
                    }
                }
            });
        });

        editProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            editNameError.style.display = 'none';
            editEmailError.style.display = 'none';
            editPasswordError.style.display = 'none';
            editRoleError.style.display = 'none';

            const reference = editRefInput.value.trim();
            const category = editCatSelect.value;
            const rawSize = editSizeInput.value.trim();
            const sizeArray = rawSize.split(',').map(s => s.trim()).filter(Boolean);
            const salePrice = parsePrice(editSalePriceInput.value);
            const purchasePrice = parsePrice(editPurchasePriceInput.value);

            let hasError = false;

            if (!sizeArray || sizeArray.length === 0) {
                editNameError.textContent = 'Ingresa al menos una talla.';
                editNameError.style.display = 'block';
                hasError = true;
            }

            if (!category) {
                editRoleError.textContent = 'Selecciona una categoría.';
                editRoleError.style.display = 'block';
                hasError = true;
            }

            if (salePrice <= 0) {
                editEmailError.textContent = 'El precio de venta debe ser mayor a 0.';
                editEmailError.style.display = 'block';
                hasError = true;
            }

            if (purchasePrice <= 0) {
                editPasswordError.textContent = 'El precio de compra debe ser mayor a 0.';
                editPasswordError.style.display = 'block';
                hasError = true;
            }

            if (hasError) return;

            btnSaveEdit.disabled = true;
            btnSaveEditText.style.display = 'none';
            btnSaveEditLoader.style.display = 'flex';

            try {
                const { error: updateError } = await supabase
                    .from('products')
                    .update({
                        categorie: category,
                        size: sizeArray,
                        sale_price: salePrice,
                        purchase_price: purchasePrice
                    })
                    .eq('reference', reference);

                if (updateError) throw updateError;

                closeEditProductModal();
                await loadProducts();
            } catch (err) {
                console.error('Error updating product:', err);
                alert(err.message || 'Error al actualizar el producto');
            } finally {
                btnSaveEdit.disabled = false;
                btnSaveEditText.style.display = 'inline';
                btnSaveEditLoader.style.display = 'none';
            }
        });

        btnCrear.addEventListener('click', async () => {
            const rows = productRows.querySelectorAll('.product-row');
            const products = [];
            let hasError = false;

            rows.forEach((row) => {
                const refInput = row.querySelector('input[name^="reference_"]');
                const catSelect = row.querySelector('select[name^="category_"]');
                const sizeInput = row.querySelector('input[name^="size_"]');
                const saleInput = row.querySelector('input[name^="sale_price_"]');
                const purchaseInput = row.querySelector('input[name^="purchase_price_"]');

                const reference = refInput.value.trim();
                const category = catSelect.value;
                const rawSize = sizeInput.value.trim();
                const sizeArray = rawSize.split(',').map(s => s.trim()).filter(Boolean);
                const salePrice = parsePrice(saleInput.value);
                const purchasePrice = parsePrice(purchaseInput.value);

                if (!reference || reference.length < 2) hasError = true;
                if (!category) hasError = true;
                if (!sizeArray || sizeArray.length === 0) hasError = true;
                if (salePrice <= 0) hasError = true;
                if (purchasePrice <= 0) hasError = true;

                products.push({ reference, category, size: sizeArray, salePrice, purchasePrice });
            });

            if (hasError) {
                alert('Completa todos los campos correctamente en todas las filas.');
                return;
            }

            btnCrear.disabled = true;
            btnCrearText.style.display = 'none';
            btnCrearLoader.style.display = 'flex';

            try {
                const now = new Date();
                const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

                for (const product of products) {
                    const { error: insertError } = await supabase
                        .from('products')
                        .insert({
                            reference: product.reference,
                            categorie: product.category,
                            size: product.size,
                            sale_price: product.salePrice,
                            purchase_price: product.purchasePrice,
                            created_at: ts
                        });

                    if (insertError) {
                        throw insertError;
                    }
                }

                closeProductModal();
                await loadProducts();
            } catch (err) {
                console.error('Error creating products:', err);
                alert(err.message || 'Error al crear los productos');
            } finally {
                btnCrear.disabled = false;
                btnCrearText.style.display = 'inline';
                btnCrearLoader.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            // Todos los usuarios con sesión pueden acceder a la gestión de productos
            const profile = await guardPage();
            if (!profile) return;

            await loadProducts();
        });
    </script>
</body>
</html>
